name: .NET Build and Release Artifacts

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate version files
        shell: pwsh
        run: |
          $rootVersion = (Get-Content -Path "$env:GITHUB_WORKSPACE/version.txt" -Raw).Trim()
          $appVersion = (Get-Content -Path "$env:GITHUB_WORKSPACE/App/version.txt" -Raw).Trim()

          if ([string]::IsNullOrWhiteSpace($rootVersion) -or [string]::IsNullOrWhiteSpace($appVersion)) {
            throw "One or both version files are empty."
          }

          if ($rootVersion -ne $appVersion) {
            throw "Version mismatch: version.txt ($rootVersion) does not match App/version.txt ($appVersion)."
          }

          Write-Host "Validated version: $rootVersion"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore DAWPresence.sln

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish App/App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:SelfContained=false `
            -p:Platform=x64 `
            -o "$env:GITHUB_WORKSPACE/App/publish"

      - name: Build installer
        shell: pwsh
        run: dotnet build Installer/Installer.wixproj -c Release -p:Platform=x64

      - name: Locate installer MSI
        id: locate_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/Installer" -Recurse -Filter "DAWPresence-*-installer.msi" | Select-Object -First 1
          if (-not $installer) {
            throw "No MSI installer was produced."
          }

          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAWPresence-portable
          path: App/publish
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAWPresence-installer
          path: ${{ env.installer_path }}
          if-no-files-found: error
